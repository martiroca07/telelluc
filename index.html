<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>terminal</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #eeeeee;
            --dim: #888888;
            --user-color: #4e9a06;
            --path-color: #3465a4;
            --error: #ff5555;
            --suggest-bg: #1a1a1a;
            --suggest-active-bg: #3465a4;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: "DejaVu Sans Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 15px;
        }

        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--fg);
            padding: 16px 20px;
            cursor: text;
        }

        #login-output {
            flex: 1;
        }

        #login-input-bar {
            display: flex;
            align-items: baseline;
        }

        #login-prompt-label {
            flex-shrink: 0;
        }

        #login-typed {
            white-space: pre-wrap;
            word-break: break-word;
        }

        #app {
            display: none;
        }

        #app.visible {
            display: contents;
        }

        #terminal {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            cursor: text;
        }

        #corner-banner {
            position: fixed;
            top: 10px;
            right: 18px;
            z-index: 10;
            margin: 0;
            font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.15;
            white-space: pre;
            pointer-events: none;
            user-select: none;
            background-image: linear-gradient(90deg, #ff0000, #ff9900, #ffee00, #33ff00, #00c3ff, #7700ff, #ff0000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-move 4s linear infinite;
        }

        #corner-banner.hidden {
            display: none;
        }

        @keyframes rainbow-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        #output-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 40px 20px 0;
            line-height: 1.45;
        }

        #output-wrap::-webkit-scrollbar {
            width: 10px;
        }

        #output-wrap::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 6px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-line {
            display: flex;
            align-items: baseline;
        }

        #bottom-bar {
            position: relative;
            flex-shrink: 0;
        }

        #input-bar {
            padding: 8px 20px 16px;
            line-height: 1.45;
        }

        .prompt {
            flex-shrink: 0;
            margin-right: 8px;
        }

        .p-user {
            color: var(--user-color);
            font-weight: bold;
        }

        .p-path {
            color: var(--path-color);
            font-weight: bold;
        }

        .p-sep {
            color: var(--fg);
        }

        .dim {
            color: var(--dim);
        }

        .error {
            color: var(--error);
        }

        #suggestions {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 20px;
            background: var(--bg);
        }

        #suggestions.visible {
            display: flex;
        }

        #suggestions .suggestion {
            background: var(--suggest-bg);
            color: var(--fg);
            padding: 2px 10px;
            border-radius: 4px;
        }

        #suggestions .suggestion.active {
            background: var(--suggest-active-bg);
            color: #ffffff;
        }

        #input-line {
            flex: 1;
            position: relative;
            min-height: 1.3em;
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #typed {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.05em;
            background: var(--fg);
            vertical-align: text-bottom;
            animation: blink 1s steps(1) infinite;
            margin-left: 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div id="login-output"></div>
        <div id="login-input-bar">
            <span id="login-prompt-label"></span>
            <span id="login-typed"></span><span class="cursor"></span>
        </div>
    </div>

    <div id="app">
        <pre id="corner-banner"> _       _      _ _
| |_ ___| | ___| | |_   _  ___
| __/ _ \ |/ _ \ | | | | |/ __|
| ||  __/ |  __/ | | |_| | (__
 \__\___|_|\___|_|_|\__,_|\___| </pre>
        <div id="terminal">
            <div id="output-wrap">
                <div id="output"></div>
            </div>
            <div id="bottom-bar">
                <div id="suggestions"></div>
                <div class="prompt-line" id="input-bar">
                    <span class="prompt" id="prompt-label"></span>
                    <div id="input-line"><span id="typed"></span><span class="cursor"></span></div>
                </div>
            </div>
        </div>
    </div>

    <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" />

    <script>
        const VALID_USER = 'rayo';
        const VALID_PASS = 'RayoRex28?';

        const loginScreen = document.getElementById('login-screen');
        const loginOutput = document.getElementById('login-output');
        const loginPromptLabel = document.getElementById('login-prompt-label');
        const loginTyped = document.getElementById('login-typed');
        const appRoot = document.getElementById('app');

        const terminal = document.getElementById('terminal');
        const outputWrap = document.getElementById('output-wrap');
        const output = document.getElementById('output');
        const typed = document.getElementById('typed');
        const hiddenInput = document.getElementById('hidden-input');
        const promptLabel = document.getElementById('prompt-label');
        const suggestionsBar = document.getElementById('suggestions');
        const cornerBanner = document.getElementById('corner-banner');

        const host = 'telelluc';
        const user = 'user';
        const history = [];
        let historyIndex = -1;
        let lang = 'en';
        let bannerEnabled = true;

        let authenticated = false;
        let loginStage = 'username';
        let pendingUsername = '';

        const strings = {
            en: {
                welcome: 'Welcome. Type "help" to see the available commands.',
                helpHeader: 'Available commands:',
                helpLines: [
                    'help          show this help',
                    'echo [text]   repeat the text',
                    'date          show the current date and time',
                    'whoami        show the current user',
                    'clear / cls   clear the screen',
                    'showbanner    toggle the rainbow "telelluc" text (top-right)',
                    'language      switch the interface language (English/Español)',
                    'crash         trigger the local telelluc.py error popup'
                ],
                notFound: (cmd) => `command not found: ${cmd}`,
                tryHelp: 'type "help" to see the available commands',
                langSwitched: 'Language set to English.',
                crashFailed: 'Could not reach telelluc.py — is it running?'
            },
            es: {
                welcome: 'Bienvenido. Escribí "help" para ver los comandos disponibles.',
                helpHeader: 'Comandos disponibles:',
                helpLines: [
                    'help          muestra esta ayuda',
                    'echo [texto]  repite el texto',
                    'date          muestra la fecha y hora actual',
                    'whoami        muestra el usuario actual',
                    'clear / cls   limpia la pantalla',
                    'showbanner    activa/desactiva el texto "telelluc" (arcoíris, arriba a la derecha)',
                    'language      cambia el idioma de la interfaz (English/Español)',
                    'crash         dispara el error emergente de telelluc.py'
                ],
                notFound: (cmd) => `comando no encontrado: ${cmd}`,
                tryHelp: 'escribí "help" para ver los comandos disponibles',
                langSwitched: 'Idioma cambiado a Español.',
                crashFailed: 'No se pudo contactar a telelluc.py — ¿está corriendo?'
            }
        };

        function t() {
            return strings[lang];
        }

        function loginPrint(text = '') {
            const div = document.createElement('div');
            div.className = 'line';
            div.textContent = text;
            loginOutput.appendChild(div);
        }

        function setLoginPrompt(text) {
            loginPromptLabel.textContent = text;
        }

        function startLogin() {
            loginPrint('Debian GNU/Linux 12 telelluc tty1');
            loginPrint('');
            setLoginPrompt('telelluc login: ');
        }

        function grantAccess() {
            authenticated = true;
            loginScreen.style.display = 'none';
            appRoot.classList.add('visible');
            hiddenInput.value = '';
            refreshTyped();
            updatePrompt();
            print(t().welcome, 'dim');
            hiddenInput.focus();
        }

        function loginFail() {
            loginTyped.textContent = '';
            loginPrint('');
            loginPrint('Login incorrect');
            loginStage = 'username';
            pendingUsername = '';
            setLoginPrompt('telelluc login: ');
        }

        function handleLoginEnter(value) {
            if (loginStage === 'username') {
                pendingUsername = value;
                loginTyped.textContent = '';
                loginStage = 'password';
                setLoginPrompt('Password: ');
            } else {
                if (pendingUsername === VALID_USER && value === VALID_PASS) {
                    grantAccess();
                } else {
                    loginFail();
                }
            }
        }

        function updatePrompt() {
            promptLabel.innerHTML =
                `<span class="p-user">${user}@${host}</span>` +
                `<span class="p-sep">:</span>` +
                `<span class="p-path">~</span>` +
                `<span class="p-sep">$</span>`;
        }

        function print(text = '', className = '') {
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' ' + className : '');
            div.textContent = text;
            output.appendChild(div);
        }

        function scrollToBottom() {
            outputWrap.scrollTop = outputWrap.scrollHeight;
        }

        const commands = {
            help() {
                print(t().helpHeader);
                t().helpLines.forEach((line) => print('  ' + line));
            },
            showbanner() {
                bannerEnabled = !bannerEnabled;
                cornerBanner.classList.toggle('hidden', !bannerEnabled);
            },
            echo(args) {
                print(args.join(' '));
            },
            date() {
                const now = new Date();
                print(lang === 'es' ? now.toLocaleString('es-ES') : now.toLocaleString('en-US'));
            },
            whoami() {
                print(user);
            },
            clear() {
                output.innerHTML = '';
            },
            language() {
                lang = lang === 'en' ? 'es' : 'en';
                print(t().langSwitched, 'dim');
            },
            crash() {
                fetch('http://127.0.0.1:5005/crash').catch(() => {
                    print(t().crashFailed, 'error');
                });
            }
        };
        commands.cls = commands.clear;

        const commandNames = Object.keys(commands).sort();

        function runCommand(raw) {
            const trimmed = raw.trim();
            if (trimmed.length > 0) {
                history.push(trimmed);
            }
            historyIndex = history.length;

            const echoLine = document.createElement('div');
            echoLine.className = 'prompt-line';
            const p = document.createElement('span');
            p.className = 'prompt';
            p.innerHTML = promptLabel.innerHTML;
            echoLine.appendChild(p);
            const cmdText = document.createElement('span');
            cmdText.textContent = raw;
            echoLine.appendChild(cmdText);
            output.appendChild(echoLine);

            if (trimmed.length === 0) return;

            const [cmd, ...args] = trimmed.split(/\s+/);
            const fn = commands[cmd.toLowerCase()];
            if (fn) {
                fn(args);
            } else {
                print(t().notFound(cmd), 'error');
                print(t().tryHelp, 'dim');
            }
        }

        function refreshTyped() {
            typed.textContent = hiddenInput.value;
        }

        let suggestions = [];
        let suggestionIndex = 0;

        function computeSuggestions(value) {
            const v = value.toLowerCase();
            if (!v) return [];
            return commandNames.filter((name) => name.startsWith(v));
        }

        function renderSuggestions() {
            suggestionsBar.innerHTML = '';
            if (suggestions.length === 0) {
                suggestionsBar.classList.remove('visible');
                return;
            }
            suggestions.forEach((name, i) => {
                const span = document.createElement('span');
                span.className = 'suggestion' + (i === suggestionIndex ? ' active' : '');
                span.textContent = name;
                suggestionsBar.appendChild(span);
            });
            suggestionsBar.classList.add('visible');
        }

        function updateSuggestionsFromInput() {
            suggestions = computeSuggestions(hiddenInput.value);
            suggestionIndex = 0;
            renderSuggestions();
        }

        hiddenInput.addEventListener('input', () => {
            if (!authenticated) {
                loginTyped.textContent = loginStage === 'password' ? '' : hiddenInput.value;
                return;
            }
            refreshTyped();
            updateSuggestionsFromInput();
            scrollToBottom();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (!authenticated) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = hiddenInput.value;
                    hiddenInput.value = '';
                    loginTyped.textContent = '';
                    handleLoginEnter(value);
                }
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const value = hiddenInput.value;
                hiddenInput.value = '';
                refreshTyped();
                suggestions = [];
                renderSuggestions();
                runCommand(value);
                scrollToBottom();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                if (suggestions.length === 0) return;
                hiddenInput.value = suggestions[suggestionIndex];
                refreshTyped();
                updateSuggestionsFromInput();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex - 1 + suggestions.length) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.max(0, historyIndex - 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex + 1) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.min(history.length, historyIndex + 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'Escape') {
                suggestions = [];
                renderSuggestions();
            }
        });

        terminal.addEventListener('click', () => {
            hiddenInput.focus();
        });

        loginScreen.addEventListener('click', () => {
            hiddenInput.focus();
        });

        window.addEventListener('load', () => {
            hiddenInput.focus();
            startLogin();
        });
    </script>
</body>
</html>
