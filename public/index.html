<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>-TL-</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #eeeeee;
            --dim: #888888;
            --user-color: #4e9a06;
            --path-color: #3465a4;
            --error: #ff5555;
            --suggest-bg: #1a1a1a;
            --suggest-active-bg: #3465a4;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: "DejaVu Sans Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: clamp(12px, 2vw, 16px);
        }

        @media (max-width: 768px) {
            html, body {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            html, body {
                font-size: 13px;
            }
        }

        #terminal {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            cursor: text;
        }

        #corner-banner {
            position: fixed;
            top: 10px;
            right: 18px;
            z-index: 10;
            margin: 0;
            font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.15;
            white-space: pre;
            pointer-events: none;
            user-select: none;
            background-image: linear-gradient(90deg, #ff0000, #ff9900, #ffee00, #33ff00, #00c3ff, #7700ff, #ff0000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-move 4s linear infinite;
        }

        #corner-banner.hidden {
            display: none;
        }

        #version-badge {
            position: fixed;
            bottom: 10px;
            right: 18px;
            z-index: 10;
            font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 10px;
            color: #999999;
            pointer-events: none;
            user-select: none;
        }

        @keyframes rainbow-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        #output-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: clamp(10px, 3vh, 40px) clamp(10px, 3vw, 20px) 0;
            line-height: 1.45;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            #output-wrap {
                padding: 20px 12px 0;
            }
        }

        #output-wrap::-webkit-scrollbar {
            width: 10px;
        }

        #output-wrap::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 6px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-line {
            display: flex;
            align-items: baseline;
        }

        #bottom-bar {
            position: relative;
            flex-shrink: 0;
        }

        #input-bar {
            padding: clamp(8px, 2vh, 16px) clamp(12px, 3vw, 20px) clamp(10px, 2vh, 16px);
            line-height: 1.45;
            min-height: 2.5em;
        }

        @media (max-width: 768px) {
            #input-bar {
                padding: 10px 12px 12px;
                min-height: 3em;
            }
        }

        .prompt {
            flex-shrink: 0;
            margin-right: clamp(4px, 1vw, 8px);
            word-break: break-all;
        }

        .p-user {
            color: var(--user-color);
            font-weight: bold;
        }

        .p-path {
            color: var(--path-color);
            font-weight: normal;
            opacity: 0.9;
        }

        .p-sep {
            color: var(--dim);
            font-weight: normal;
        }

        .prompt.control-mode {
            opacity: 0.95;
            font-weight: normal;
        }

        .dim {
            color: var(--dim);
        }

        .error {
            color: var(--error);
        }

        #suggestions {
            display: none !important;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            gap: clamp(4px, 1vw, 6px);
            flex-wrap: wrap;
            padding: clamp(4px, 1vh, 6px) clamp(12px, 3vw, 20px);
            background: var(--bg);
            max-height: 30vh;
            overflow-y: auto;
            min-height: 0 !important;
            height: auto !important;
        }

        #suggestions.visible {
            display: flex !important;
        }

        #suggestions .suggestion {
            background: var(--suggest-bg);
            color: var(--fg);
            padding: clamp(3px, 1vw, 10px) clamp(6px, 2vw, 12px);
            border-radius: 4px;
            font-size: 0.95em;
            cursor: pointer;
            user-select: none;
        }

        #suggestions .suggestion.active {
            background: var(--suggest-active-bg);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            #suggestions .suggestion {
                padding: 6px 10px;
                min-height: 2em;
                display: flex;
                align-items: center;
            }
        }

        #input-line {
            flex: 1;
            position: relative;
            min-height: clamp(1.3em, 5vw, 2em);
            word-break: break-all;
        }

        #hidden-input {
            position: fixed;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
            font-size: 16px;
            width: 0;
            height: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        #typed {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.05em;
            background: var(--fg);
            vertical-align: text-bottom;
            animation: blink 1s steps(1) infinite;
            margin-left: 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            #corner-banner {
                display: none !important;
            }

            #version-badge {
                display: none !important;
            }

            .line {
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .prompt-line {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 4px;
            }

            #suggestions {
                max-height: 40vh;
            }
        }

        @media (max-width: 480px) {
            #corner-banner {
                font-size: 7px;
                top: 2px;
                right: 8px;
            }

            #output-wrap {
                padding: 15px 8px 0;
                font-size: 12px;
            }

            #input-bar {
                padding: 8px 8px 10px;
            }

            .line {
                font-size: 12px;
            }

            #suggestions .suggestion {
                padding: 8px 12px;
                min-height: 2.5em;
                font-size: 13px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
                padding-bottom: max(0px, env(safe-area-inset-bottom));
            }

            #input-bar {
                padding-bottom: max(clamp(8px, 2vh, 16px), env(safe-area-inset-bottom));
            }
        }

        #nano-editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #nano-editor-overlay.hidden {
            display: none;
        }

        .nano-editor-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            height: 90%;
            max-width: 1200px;
            background: var(--bg);
            border: 1px solid #555;
            color: var(--fg);
            font-family: "DejaVu Sans Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
        }

        .nano-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }

        .nano-filename {
            color: #4e9a06;
        }

        .nano-help {
            color: var(--dim);
            font-size: 12px;
        }

        #nano-editor-content {
            flex: 1;
            padding: 12px;
            background: var(--bg);
            color: var(--fg);
            border: none;
            outline: none;
            font-family: "DejaVu Sans Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 14px;
            resize: none;
        }

        .nano-editor-status {
            padding: 8px 12px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            font-size: 12px;
            color: var(--dim);
        }
    </style>
</head>
<body>
    <pre id="corner-banner"> _       _      _ _
| |_ ___| | ___| | |_   _  ___
| __/ _ \ |/ _ \ | | | | |/ __|
| ||  __/ |  __/ | | |_| | (__
 \__\___|_|\___|_|_|\__,_|\___| </pre>
    <div id="version-badge">v0.0.80</div>
    <div id="terminal">
        <div id="output-wrap">
            <div id="output"></div>
        </div>
        <div id="bottom-bar">
            <div id="suggestions"></div>
            <div class="prompt-line" id="input-bar">
                <span class="prompt" id="prompt-label"></span>
                <div id="input-line"><span id="typed"></span><span class="cursor"></span></div>
            </div>
        </div>
    </div>

    <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" />

    <script>
        const terminal = document.getElementById('terminal');
        const outputWrap = document.getElementById('output-wrap');
        const output = document.getElementById('output');
        const typed = document.getElementById('typed');
        const hiddenInput = document.getElementById('hidden-input');
        const promptLabel = document.getElementById('prompt-label');
        const suggestionsBar = document.getElementById('suggestions');
        const cornerBanner = document.getElementById('corner-banner');

        const host = 'telelluc';
        const user = 'user';
        const history = [];
        let historyIndex = -1;
        let lang = 'en';
        const isMobile = window.innerWidth < 768;
        let bannerEnabled = !isMobile;
        let activeDevice = null;
        let activeDeviceHostname = null;
        let currentPath = 'C:\\';
        let controlMode = false;
        let commandExecuting = false;
        let fileCache = {};

        const strings = {
            en: {
                helpHeader: 'Available commands:',
                helpLines: [
                    'help              show this help',
                    'date              show the current date and time',
                    'clear / cls       clear the screen',
                    'showbanner        toggle the rainbow "telelluc" text (top-right)',
                    'language          switch the interface language (English/Español)',
                    'error <deviceId>  trigger error popup on a device (see "devices")',
                    'rm <deviceId>     delete a device from the list',
                    'self-delete <deviceId>  remove startup copy and local copies of the agent',
                    'control <deviceId>  open interactive control session with a device',
                    'shutdown <deviceId> [seconds]  shutdown a device (optional countdown)',
                    'reboot <deviceId> [seconds]  reboot a device (optional countdown)',
                    'sysinfo <deviceId> show system information',
                    'disk <deviceId>    show disk space usage',
                    'processes <deviceId>  list running processes',
                    'ipconfig <deviceId>  show network configuration',
                    'reset-id          reset device ID counter to 1',
                    'slow <deviceId>   reduce polling (5 min heartbeat, 6 min offline)',
                    'fast <deviceId>   restore normal polling (works from slow mode)',
                    'devices           list telelluc.py machines that have checked in',
                    'logout            end the session',
                    '',
                    'Control mode commands:',
                    'cd <path>         change directory',
                    'ls / dir          list directory contents',
                    'pwd               show current directory',
                    'cat <file>        view file contents',
                    'nano <file>       edit a file',
                    'delete <file>     delete a file or directory',
                    'mkdir <path>      create directory',
                    'copy <path>       copy file to clipboard',
                    'cut <path>        cut file to clipboard (delete after paste)',
                    'paste [path]      paste file (current dir if no path)',
                    'move <src> <dst>  move/rename file',
                    'start <file>      open file or program',
                    'get <file>        download file (max 10MB)',
                    'upload [path]     upload file to device (max 10MB)',
                    'max_audio         set volume to 100%',
                    'min_audio         set volume to 0% (muted)',
                    'mute              mute audio (volume 0%)',
                    'unmute            unmute audio (volume 50%)',
                    'clear / cls       clear the screen',
                    'exit              exit control mode'
                ],
                notFound: (cmd) => `command not found: ${cmd}`,
                tryHelp: 'type "help" to see the available commands',
                langSwitched: 'Language set to English.',
                errorFailed: 'Could not reach telelluc.py — is it running?',
                rmFailed: 'Could not delete device.',
                devicesFailed: 'Could not load device list.',
                devicesEmpty: 'No devices have checked in yet.'
            },
            es: {
                welcome: 'Bienvenido. Escribí "help" para ver los comandos disponibles.',
                helpHeader: 'Comandos disponibles:',
                helpLines: [
                    'help              muestra esta ayuda',
                    'date              muestra la fecha y hora actual',
                    'clear / cls       limpia la pantalla',
                    'showbanner        activa/desactiva el texto "telelluc" (arcoíris, arriba a la derecha)',
                    'language          cambia el idioma de la interfaz (English/Español)',
                    'error <deviceId>  dispara error en una máquina (ver "devices")',
                    'rm <deviceId>     elimina un dispositivo de la lista',
                    'self-delete <deviceId>  elimina la copia de arranque y las copias locales del agente',
                    'control <deviceId>  abre una sesión de control interactiva con un dispositivo',
                    'shutdown <deviceId> [seconds]  apaga un dispositivo (countdown opcional)',
                    'reboot <deviceId> [seconds]  reinicia un dispositivo (countdown opcional)',
                    'sysinfo <deviceId>  muestra información del sistema',
                    'disk <deviceId>     muestra el uso del disco',
                    'processes <deviceId>  lista procesos en ejecución',
                    'ipconfig <deviceId>  muestra configuración de red',
                    'reset-id           reinicia el contador de IDs a 1',
                    'slow <deviceId>    reduce el polling (heartbeat 5 min, 6 min offline)',
                    'fast <deviceId>    restaura el polling normal (funciona desde slow mode)',
                    'devices            lista las máquinas de telelluc.py que se registraron',
                    'logout            cierra la sesión',
                    '',
                    'Comandos en modo control:',
                    'cd <ruta>         cambia de directorio',
                    'ls / dir          lista el contenido del directorio',
                    'pwd               muestra el directorio actual',
                    'cat <archivo>     ve el contenido de un archivo',
                    'nano <archivo>    edita un archivo',
                    'delete <archivo>  elimina un archivo o directorio',
                    'mkdir <ruta>      crea directorio',
                    'copy <ruta>       copia archivo al portapapeles',
                    'cut <ruta>        corta archivo al portapapeles (elimina después de pegar)',
                    'paste [ruta]      pega archivo (directorio actual si no se especifica)',
                    'move <src> <dst>  mueve/renombra archivo',
                    'start <archivo>   abre archivo o programa',
                    'get <archivo>     descarga archivo (max 10MB)',
                    'upload [path]     sube archivo al dispositivo (max 10MB)',
                    'max_audio         establece volumen al 100%',
                    'min_audio         establece volumen al 0% (muteado)',
                    'mute              muteaudio (volumen 0%)',
                    'unmute            desmuteaaudio (volumen 50%)',
                    'clear / cls       limpia la pantalla',
                    'exit              sale del modo control'
                ],
                notFound: (cmd) => `comando no encontrado: ${cmd}`,
                tryHelp: 'escribí "help" para ver los comandos disponibles',
                langSwitched: 'Idioma cambiado a Español.',
                errorFailed: 'No se pudo contactar a telelluc.py — ¿está corriendo?',
                rmFailed: 'No se pudo eliminar el dispositivo.',
                devicesFailed: 'No se pudo cargar la lista de dispositivos.',
                devicesEmpty: 'Todavía no se registró ningún dispositivo.'
            }
        };

        function t() {
            return strings[lang];
        }

        function updatePrompt() {
            if (controlMode && activeDevice) {
                promptLabel.classList.add('control-mode');
                promptLabel.innerHTML =
                    `<span class="p-user">${activeDeviceHostname}</span>` +
                    `<span class="p-sep">:</span>` +
                    `<span class="p-path">${currentPath}</span>` +
                    `<span class="p-sep">$ </span>`;
            } else {
                promptLabel.classList.remove('control-mode');
                promptLabel.innerHTML =
                    `<span class="p-user">${user}@${host}</span>` +
                    `<span class="p-sep">:</span>` +
                    `<span class="p-path">~</span>` +
                    `<span class="p-sep">$</span>`;
            }
        }

        function print(text = '', className = '') {
            const div = document.createElement('div');
            div.className = 'line' + (className ? ' ' + className : '');
            div.textContent = text;
            output.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            outputWrap.scrollTop = outputWrap.scrollHeight;
        }

        function formatLastSeen(ms) {
            const diff = Date.now() - ms;
            if (diff < 0 || diff < 10000) return lang === 'es' ? 'ahora' : 'just now';
            const s = Math.floor(diff / 1000);
            if (s < 60) return lang === 'es' ? `hace ${s}s` : `${s}s ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return lang === 'es' ? `hace ${m}m` : `${m}m ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return lang === 'es' ? `hace ${h}h` : `${h}h ago`;
            const d = Math.floor(h / 24);
            return lang === 'es' ? `hace ${d}d` : `${d}d ago`;
        }

        const commands = {
            help() {
                print(t().helpHeader);
                t().helpLines.forEach((line) => print('  ' + line));
            },
            showbanner() {
                bannerEnabled = !bannerEnabled;
                cornerBanner.classList.toggle('hidden', !bannerEnabled);
            },
            date() {
                const now = new Date();
                print(lang === 'es' ? now.toLocaleString('es-ES') : now.toLocaleString('en-US'));
            },
            clear() {
                output.innerHTML = '';
            },
            language() {
                lang = lang === 'en' ? 'es' : 'en';
                print(t().langSwitched, 'dim');
            },
            error(args) {
                if (args.length === 0) {
                    print('Usage: error <deviceId> [cantidad] [message]', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }

                const deviceId = args[0];
                let cantidad = 1;
                let message = 'Error';

                if (args.length >= 2) {
                    const parsed = parseInt(args[1], 10);
                    if (!isNaN(parsed) && parsed > 0) {
                        cantidad = parsed;
                        if (args.length >= 3) {
                            message = args.slice(2).join(' ');
                        }
                    } else {
                        message = args.slice(1).join(' ');
                    }
                }

                const payload = `__error__:${cantidad}:${message}`;

                fetch('/api/shell', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, payload })
                }).then((resp) => {
                    if (!resp.ok) {
                        print(t().errorFailed, 'error');
                        return;
                    }
                    print(`Error popup(s) triggered on device #${deviceId}.`, 'dim');
                }).catch(() => {
                    print(t().errorFailed, 'error');
                });
            },
            rm(args) {
                if (args.length === 0) {
                    print('Usage: rm <deviceId>', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                fetch('/api/rm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                }).then((resp) => {
                    if (!resp.ok) {
                        print(t().rmFailed, 'error');
                        return;
                    }
                    print('Device deleted.', 'dim');
                }).catch(() => {
                    print(t().rmFailed, 'error');
                });
            },
            "self-delete"(args) {
                if (args.length === 0) {
                    print('Usage: self-delete <deviceId>', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                fetch('/api/self-delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                }).then((resp) => {
                    if (!resp.ok) {
                        print('Self-delete failed.', 'error');
                        return;
                    }
                    print('Self-delete command sent. Device will be marked offline.', 'dim');
                }).catch(() => {
                    print('Self-delete failed.', 'error');
                });
            },
            devices() {
                fetch('/api/devices').then((resp) => {
                    if (!resp.ok) {
                        print(t().devicesFailed, 'error');
                        return null;
                    }
                    return resp.json();
                }).then((data) => {
                    if (!data) return;
                    if (!data.devices || data.devices.length === 0) {
                        print(t().devicesEmpty, 'dim');
                        return;
                    }
                    const rows = data.devices.map((d) => ({
                        id: '#' + d.id,
                        hostname: d.hostname,
                        status: d.status || (d.online ? 'online' : 'offline'),
                        lastSeen: d.online || d.status === 'slowed' ? 'active' : formatLastSeen(d.lastSeen),
                        ip: d.ip,
                        version: d.version || 'unknown'
                    }));
                    const colWidth = (key, header) =>
                        rows.reduce((max, r) => Math.max(max, r[key].length), header.length);
                    const pad = (s, w) => s + ' '.repeat(Math.max(0, w - s.length));
                    const idW = colWidth('id', 'ID');
                    const hostW = colWidth('hostname', 'HOSTNAME');
                    const statusW = colWidth('status', 'STATUS');
                    const lastW = colWidth('lastSeen', 'LAST SEEN');
                    const versionW = colWidth('version', 'VERSION');
                    print(
                        pad('ID', idW) + '  ' + pad('HOSTNAME', hostW) + '  ' +
                        pad('STATUS', statusW) + '  ' + pad('LAST SEEN', lastW) + '  ' +
                        pad('VERSION', versionW) + '  IP'
                    );
                    rows.forEach((r) => {
                        print(
                            pad(r.id, idW) + '  ' + pad(r.hostname, hostW) + '  ' +
                            pad(r.status, statusW) + '  ' + pad(r.lastSeen, lastW) + '  ' +
                            pad(r.version, versionW) + '  ' + r.ip
                        );
                    });
                }).catch(() => {
                    print(t().devicesFailed, 'error');
                });
            },
            shutdown(args) {
                if (args.length === 0) {
                    print('Usage: shutdown <deviceId> [seconds]', 'dim');
                    print('Run "devices" to see available device IDs.', 'dim');
                    return;
                }
                const deviceId = args[0];
                const seconds = args[1] ? parseInt(args[1]) : 0;
                const payload = `__shutdown__:${seconds}`;
                fetch('/api/shell', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, payload })
                }).then((resp) => {
                    if (!resp.ok) {
                        print('Shutdown command failed.', 'error');
                        return;
                    }
                    const msg = seconds > 0 ? `Shutdown command sent to device #${deviceId} (${seconds}s countdown).` : `Shutdown command sent to device #${deviceId}.`;

        const commandNames = Object.keys(commands).sort();

        function sendRemoteCommand(deviceId, cmd, callback) {
            commandExecuting = true;
            hiddenInput.disabled = true;
            hiddenInput.style.opacity = '0.5';
            const cmdTimestamp = Date.now();
            const requestId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            fetch('/api/shell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, payload: cmd, requestId })
            }).then((resp) => {
                if (!resp.ok) {
                    print('Command failed.', 'error');
                    commandExecuting = false;
                    hiddenInput.disabled = false;
                    hiddenInput.style.opacity = '1';
                    hiddenInput.focus();
                    return;
                }
                // IMPORTANT: 500ms delay ONLY in control mode because agent checks every 5 seconds
                // Without delay: frontend polls immediately while agent is still sleeping
                // Timeout occurs at 6 seconds (40 attempts × 150ms) before agent dequeues
                // 500ms gives agent time to reach next check cycle without waiting full 5 seconds
                const delayMs = controlMode ? 500 : 0;
                setTimeout(() => {
                    waitForShellResult(deviceId, callback, 0, cmdTimestamp, requestId);
                }, delayMs);
            }).catch(() => {
                print('Command failed.', 'error');
                commandExecuting = false;
                hiddenInput.disabled = false;
                hiddenInput.style.opacity = '1';
                hiddenInput.focus();
            });
        }

        async function waitForShellResult(deviceId, callback, attempts = 0, cmdTimestamp = 0, requestId = null) {
            if (attempts > 40) {
                print('Timeout waiting for response.', 'error');
                commandExecuting = false;
                hiddenInput.disabled = false;
                hiddenInput.style.opacity = '1';
                hiddenInput.focus();
                return;
            }
            try {
                const resp = await fetch('/api/shell-result?deviceId=' + encodeURIComponent(deviceId) + (requestId ? '&requestId=' + encodeURIComponent(requestId) : ''));
                if (!resp.ok) {
                    await new Promise(r => setTimeout(r, 150));
                    waitForShellResult(deviceId, callback, attempts + 1, cmdTimestamp, requestId);
                    return;
                }
                const data = await resp.json();
                if (data.result && (!requestId || data.requestId === requestId)) {
                    if (callback) callback(data.result);
                    commandExecuting = false;
                    hiddenInput.disabled = false;
                    hiddenInput.style.opacity = '1';
                    hiddenInput.focus();
                } else {
                    await new Promise(r => setTimeout(r, 150));
                    waitForShellResult(deviceId, callback, attempts + 1, cmdTimestamp, requestId);
                }
            } catch (e) {
                await new Promise(r => setTimeout(r, 150));
                waitForShellResult(deviceId, callback, attempts + 1, cmdTimestamp, requestId);
            }
        }

        function runCommand(raw) {
            const trimmed = raw.trim();
            if (trimmed.length > 0) {
                history.push(trimmed);
            }
            historyIndex = history.length;

            const echoLine = document.createElement('div');
            echoLine.className = 'prompt-line';
            const p = document.createElement('span');
            p.className = 'prompt';
            p.innerHTML = promptLabel.innerHTML;
            echoLine.appendChild(p);
            const cmdText = document.createElement('span');
            cmdText.textContent = raw;
            echoLine.appendChild(cmdText);
            output.appendChild(echoLine);

            if (trimmed.length === 0) return;

            const [cmd, ...args] = trimmed.split(/\s+/);
            const allowedControlCommands = ['cd', 'ls', 'exit', 'clear', 'cls', 'nano', 'delete', 'rm', 'copy', 'paste', 'pwd', 'dir', 'help', 'cat', 'mkdir', 'move', 'mv', 'start', 'cut', 'get', 'upload', 'max_audio', 'min_audio', 'mute', 'unmute'];

            if (controlMode && !allowedControlCommands.includes(cmd.toLowerCase())) {
                print(`Command not available in control mode. Available: cd, ls, pwd, cat, nano, delete, copy, cut, paste, mkdir, move, start, get, upload, max_audio, min_audio, mute, unmute, clear, cls, help, exit`, 'error');
                return;
            }

            const fn = commands[cmd.toLowerCase()];
            if (fn) {
                fn(args);
            } else {
                print(t().notFound(cmd), 'error');
                print(t().tryHelp, 'dim');
            }
        }

        let suggestions = [];

        function computeSuggestions(value) {
            const v = value.toLowerCase();
            if (!v) return [];
            if (controlMode) {
                const allowedControlCommands = ['cd', 'ls', 'pwd', 'exit', 'clear', 'cls', 'nano', 'delete', 'rm', 'dir', 'copy', 'cut', 'paste', 'mkdir', 'move', 'mv', 'cat', 'get', 'upload', 'start', 'max_audio', 'min_audio', 'mute', 'unmute', 'help'];

                const parts = value.split(/\s+/);
                const cmd = parts[0].toLowerCase();
                const partial = parts.length > 1 ? parts.slice(1).join(' ').toLowerCase() : '';

                if (parts.length === 1) {
                    return allowedControlCommands.filter((name) => name.startsWith(v));
                }

                const cache = fileCache[currentPath] || { files: [], folders: [] };

                if (cmd === 'cd') {
                    return cache.folders.filter(f => f.toLowerCase().startsWith(partial)).map(f => `cd ${f}`);
                } else if (cmd === 'ls' || cmd === 'dir') {
                    const allItems = [...cache.files, ...cache.folders];
                    return allItems.filter(f => f.toLowerCase().startsWith(partial)).map(f => `${cmd} ${f}`);
                } else if (cmd === 'nano') {
                    const allItems = [...cache.files, ...cache.folders];
                    return allItems.filter(f => f.toLowerCase().startsWith(partial)).map(f => `nano ${f}`);
                } else if (cmd === 'delete') {
                    const allItems = [...cache.files, ...cache.folders];
                    return allItems.filter(f => f.toLowerCase().startsWith(partial)).map(f => `delete ${f}`);
                } else if (cmd === 'copy' || cmd === 'cut') {
                    const allItems = [...cache.files, ...cache.folders];
                    return allItems.filter(f => f.toLowerCase().startsWith(partial)).map(f => `${cmd} ${f}`);
                } else if (cmd === 'get' || cmd === 'cat' || cmd === 'start') {
                    const allItems = [...cache.files, ...cache.folders];
                    return allItems.filter(f => f.toLowerCase().startsWith(partial)).map(f => `${cmd} ${f}`);
                }

                return [];
            }
            const controlOnlyCommands = ['cd', 'ls', 'pwd', 'nano', 'delete', 'mkdir', 'copy', 'cut', 'paste', 'move', 'mv', 'cat', 'get', 'upload', 'start', 'dir'];
            return commandNames.filter((name) =>
                name.startsWith(v) &&
                name !== 'exit' &&
                !controlOnlyCommands.includes(name)
            );
        }

        function renderSuggestions() {
            suggestionsBar.innerHTML = '';
            if (suggestions.length === 0) {
                suggestionsBar.classList.remove('visible');
                return;
            }
            suggestions.forEach((name, i) => {
                const span = document.createElement('span');
                span.className = 'suggestion' + (i === suggestionIndex ? ' active' : '');
                span.textContent = name;
                suggestionsBar.appendChild(span);
            });
            suggestionsBar.classList.add('visible');
        }

        function updateSuggestionsFromInput() {
            suggestions = computeSuggestions(hiddenInput.value);
            suggestionIndex = 0;
            renderSuggestions();
        }

        hiddenInput.addEventListener('input', () => {
            refreshTyped();
            updateSuggestionsFromInput();
            scrollToBottom();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const value = hiddenInput.value;
                hiddenInput.value = '';
                refreshTyped();
                suggestions = [];
                suggestionsBar.innerHTML = '';
                suggestionsBar.classList.remove('visible');
                runCommand(value);
                scrollToBottom();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                if (suggestions.length === 0) return;
                hiddenInput.value = suggestions[suggestionIndex];
                refreshTyped();
                updateSuggestionsFromInput();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex - 1 + suggestions.length) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.max(0, historyIndex - 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (suggestions.length > 0) {
                    suggestionIndex = (suggestionIndex + 1) % suggestions.length;
                    renderSuggestions();
                    return;
                }
                if (history.length === 0) return;
                historyIndex = Math.min(history.length, historyIndex + 1);
                hiddenInput.value = history[historyIndex] || '';
                refreshTyped();
            } else if (e.key === 'Escape') {
                suggestions = [];
                renderSuggestions();
            }
        });

        function parseAndCacheFiles(dirOutput, path) {
            try {
                const lines = dirOutput.split('\n');
                const files = [];
                const folders = [];
                let isNewFormat = false;

                lines.forEach((line, idx) => {
                    const trimmed = line.trim();

                    // Skip empty lines, headers, and separator lines
                    if (!trimmed || trimmed.startsWith('Name') || trimmed.match(/^─+$/) ||
                        trimmed.startsWith('Directory of') || trimmed.startsWith('Volume')) {
                        if (trimmed.startsWith('Name')) isNewFormat = true;
                        return;
                    }

                    if (isNewFormat) {
                        // New format: "Name                           Size       Type"
                        // Directories: "Desktop                        <DIR>"
                        // Files: "Firefox.exe                     383.1KB"
                        if (trimmed.includes('<DIR>')) {
                            const name = trimmed.split(/\s+<DIR>/)[0].trim();
                            if (name && name !== '.' && name !== '..') {
                                folders.push(name);
                            }
                        } else if (trimmed && !trimmed.includes('...') && trimmed.match(/\s+[0-9]/)) {
                            // Match files with size pattern (ends with size like "383.1KB" or "949B")
                            const name = trimmed.replace(/\s+[0-9B.KMG]+\s*$/, '').trim();
                            if (name && name !== '.' && name !== '..') {
                                files.push(name);
                            }
                        }
                    } else {
                        // Old format fallback
                        const parts = trimmed.split(/\s+/);
                        if (parts.length >= 4) {
                            const name = parts.slice(3).join(' ');
                            if (trimmed.includes('<DIR>') || trimmed.includes('<JUNCTION>')) {
                                if (name !== '.' && name !== '..') {
                                    folders.push(name);
                                }
                            } else if (name && !name.match(/^\d+\s+(File|Dir)/)) {
                                files.push(name);
                            }
                        }
                    }
                });

                if (Object.keys(fileCache).length > 50) {
                    const keys = Object.keys(fileCache);
                    delete fileCache[keys[0]];
                }
                fileCache[path] = { files, folders };
            } catch (e) {
                // ignore parse errors
            }
        }

        function openNanoEditor(output, filename) {
            const overlay = document.getElementById('nano-editor-overlay');
            const textarea = document.getElementById('nano-editor-content');
            const filenameSpan = document.querySelector('.nano-filename');
            const statusSpan = document.getElementById('nano-status');

            const lines = output.split('[NANO_EDIT:');
            if (lines.length < 2) return;

            const afterFilename = lines[1].split(']\n');
            if (afterFilename.length < 2) return;

            const content = output.split('[END_NANO]')[0];
            const fileContent = content.split(']\n').slice(1).join(']\n');
            const originalContent = fileContent;

            filenameSpan.textContent = filename;
            textarea.value = fileContent;
            statusSpan.textContent = 'Ready (Ctrl+O: Save, Ctrl+X: Exit)';

            overlay.classList.remove('hidden');
            textarea.focus();

            function closeEditor() {
                overlay.classList.add('hidden');
                textarea.removeEventListener('keydown', handleKeydown);
                hiddenInput.focus();
            }

            function showSaveConfirm() {
                const confirmDiv = document.createElement('div');
                confirmDiv.style.cssText = `
                    position: fixed;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.9);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1001;
                `;
                confirmDiv.innerHTML = `
                    <div style="
                        background: #1a1a1a;
                        border: 1px solid #555;
                        padding: 20px;
                        border-radius: 4px;
                        color: #eeeeee;
                        font-family: monospace;
                        text-align: center;
                    ">
                        <div style="margin-bottom: 20px;">Save changes before exit?</div>
                        <div style="display: flex; gap: 20px; justify-content: center;">
                            <button id="btn-yes" style="
                                background: #4e9a06;
                                color: white;
                                border: none;
                                padding: 8px 20px;
                                cursor: pointer;
                                border-radius: 2px;
                            ">Yes</button>
                            <button id="btn-no" style="
                                background: #555;
                                color: white;
                                border: none;
                                padding: 8px 20px;
                                cursor: pointer;
                                border-radius: 2px;
                            ">No</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(confirmDiv);

                const btnYes = confirmDiv.querySelector('#btn-yes');
                const btnNo = confirmDiv.querySelector('#btn-no');

                return new Promise((resolve) => {
                    btnYes.addEventListener('click', () => {
                        confirmDiv.remove();
                        resolve(true);
                    });
                    btnNo.addEventListener('click', () => {
                        confirmDiv.remove();
                        resolve(false);
                    });
                });
            }

            const handleKeydown = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    if (e.key === 'o' || e.key === 'O') {
                        e.preventDefault();
                        const content = textarea.value;
                        const saveCmd = `__nano_save__:${filename}:${content}`;
                        statusSpan.textContent = 'Saving...';

                        fetch('/api/shell', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ deviceId: activeDevice, payload: saveCmd })
                        }).then((resp) => {
                            if (resp.ok) {
                                statusSpan.textContent = 'File saved!';
                                setTimeout(() => {
                                    statusSpan.textContent = 'Ready (Ctrl+O: Save, Ctrl+X: Exit)';
                                }, 1000);
                            } else {
                                statusSpan.textContent = 'Save failed!';
                            }
                        }).catch(() => {
                            statusSpan.textContent = 'Save failed!';
                        });
                    } else if (e.key === 'x' || e.key === 'X') {
                        e.preventDefault();
                        const hasChanges = textarea.value !== originalContent;
                        if (hasChanges) {
                            showSaveConfirm().then((shouldSave) => {
                                if (shouldSave) {
                                    const saveCmd = `__nano_save__:${filename}:${textarea.value}`;
                                    fetch('/api/shell', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ deviceId: activeDevice, payload: saveCmd })
                                    }).then(() => {
                                        closeEditor();
                                    }).catch(() => {
                                        statusSpan.textContent = 'Save failed!';
                                    });
                                } else {
                                    closeEditor();
                                }
                            });
                        } else {
                            closeEditor();
                        }
                    }
                }
            };

            textarea.addEventListener('keydown', handleKeydown);
        }

        terminal.addEventListener('click', () => {
            hiddenInput.focus();
        });

        window.addEventListener('load', () => {
            hiddenInput.focus();
            updatePrompt();
            print(t().welcome, 'dim');
        });

        window.addEventListener('beforeunload', () => {
            if (controlMode && activeDevice) {
                fetch('/api/shell', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: activeDevice, payload: 'exit' }),
                    keepalive: true
                }).catch(() => {});
            }
        });
    </script>
    <div id="nano-editor-overlay" class="hidden">
        <div class="nano-editor-container">
            <div class="nano-editor-header">
                <span class="nano-filename"></span>
                <span class="nano-help">^O:Save  ^X:Exit</span>
            </div>
            <textarea id="nano-editor-content" class="nano-editor-textarea"></textarea>
            <div class="nano-editor-status">
                <span id="nano-status">Ready</span>
            </div>
        </div>
    </div>
</body>
</html>
